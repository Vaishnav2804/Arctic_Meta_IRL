[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arctic-meta-irl"
version = "1.0.0"
description = "Inverse reinforcement learning for Arctic vessel route modeling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "networkx>=3.0",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "h3>=4.0",
  "tqdm>=4.65",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "tensorboard>=2.13"]
notebooks = ["cartopy>=0.24", "jupyter", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
include = ["arctic_meta_irl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
